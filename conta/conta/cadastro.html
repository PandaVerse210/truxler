
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - TRUXLER</title>
  <link rel="stylesheet" href="conta.css">
</head>
<body>

<div class="container">
  <a href="../index.html" class="logo">TRUXLER.</a>

  <h1>Crie sua conta!</h1>
  <p>Faça parte da nossa comunidade de leitores e escritores.</p>

  <form id="cadastroForm">
    <label>Nome completo</label>
    <input type="text" id="nome" placeholder="Seu nome" required>

    <label>Email</label>
    <input type="email" id="email" placeholder="Seu email" required>

    <label>Senha</label>
    <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>

    <button type="submit">Criar minha conta</button>
  </form>

  <p class="bottom">
    Já possui uma conta?
    <a href="login.html">Entrar</a>
  </p>

  <a href="../index.html" class="back">← Voltar ao início</a>
  <p id="mensagem"></p>
</div>

<script src="conta.js"></script>
</body>
</html>
